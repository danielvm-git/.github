name: Test Build Release
# version: 4.2.0 — see workflow-templates/CHANGELOG.md
# Reusable workflow: call with `uses: danielvm-git/.github/.github/workflows/test-build-release-static.yml@main`
# Or copy to .github/workflows/test-build-release.yml and pair with deploy-static.yml → deploy.yml
#
# big-release contract (default release_tool):
#   - Root `VERSION` file: updated post-release from the new git tag and committed with `[skip ci]`.
#   - `CHANGELOG.md` header format: must start with `# Changelog` on line 1 followed by
#     `## [Unreleased]` and `## [<version>]` sections (`big-release`'s changelog plugin
#     scans for the first `## ` header after line 0; top-level `# <version>` headers
#     silently no-op or drop entries).

on:
  workflow_call:
    inputs:
      site_url:
        description: "Site URL for deploy metadata (optional, defaults to placeholder)"
        required: false
        type: string
        default: "https://CHANGE-ME.bigbase.click"
      node_version:
        description: "Node.js version for setup-node"
        required: false
        type: string
        default: "24"
      release_tool:
        description: "Release tool to run: big-release | semantic-release"
        required: false
        type: string
        default: "big-release"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_TYPE: static
  SITE_URL: ${{ inputs.site_url || 'https://CHANGE-ME.bigbase.click' }}
  NODE_VERSION: ${{ inputs.node_version || '24' }}
  RELEASE_TOOL: ${{ inputs.release_tool || 'big-release' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ inputs.node_version || '24' }}
          cache: npm

      - name: Preflight
        run: |
          if [ -f scripts/preflight.sh ]; then
            bash scripts/preflight.sh
          elif [ -f Makefile ] && grep -q '^preflight:' Makefile; then
            make preflight
          elif command -v npm >/dev/null 2>&1 && grep -q '"preflight"' package.json 2>/dev/null; then
            npm run preflight
          else
            echo "WARN: No preflight script found — add scripts/preflight.sh"
          fi

      - name: Check Conventional Commits
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          git log origin/main..HEAD --format=%s | while read -r line; do
            # Skip merge commits (GitHub auto-merge for PRs)
            if echo "$line" | grep -qE "^Merge "; then
              continue
            fi
            if ! echo "$line" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: "; then
              echo "FAIL: Non-conventional commit: $line"
              exit 1
            fi
          done
          echo "PASS: All commits follow Conventional Commits"

      - name: Check no AI agent attribution
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          if git log origin/main..HEAD --format="%B" | grep -qiE '^co[- ]authored[- ]by:'; then
            echo "FAIL: Co-authored-by: footer found — blocked by CONVENTIONS.md"
            exit 1
          fi
          echo "PASS: No AI agent attribution"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

  build:
    needs: [test]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ inputs.node_version || '24' }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Write deploy-meta
        run: |
          jq -n \
            --arg sha "${{ github.sha }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg app_type "${{ env.APP_TYPE }}" \
            '{sha: $sha, ref: $ref, app_type: $app_type}' > deploy-meta.json

      - name: Upload deploy-meta artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deploy-meta
          path: deploy-meta.json
          retention-days: 3

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run big-release
        if: (inputs.release_tool || env.RELEASE_TOOL || 'big-release') == 'big-release'
        run: |
          curl -sL https://github.com/danielvm-git/big-release/releases/latest/download/big-release-linux-amd64 -o big-release
          chmod +x big-release
          sudo mv big-release /usr/local/bin/
          big-release release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: big-release-bot
          GIT_AUTHOR_EMAIL: big-release-bot@danielvm-git.github.io
          GIT_COMMITTER_NAME: big-release-bot
          GIT_COMMITTER_EMAIL: big-release-bot@danielvm-git.github.io

      - name: Update VERSION file
        if: (inputs.release_tool || env.RELEASE_TOOL || 'big-release') == 'big-release'
        run: |
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$NEW_TAG" ]; then
            NEW_VER="${NEW_TAG#v}"
            echo "$NEW_VER" > VERSION
            if ! git diff --quiet VERSION; then
              git config user.name "big-release-bot"
              git config user.email "big-release-bot@danielvm-git.github.io"
              git add VERSION
              git commit -m "chore(release): update VERSION to $NEW_VER [skip ci]"
              git push origin main
            fi
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: (inputs.release_tool || env.RELEASE_TOOL) == 'semantic-release'
        with:
          node-version: ${{ inputs.node_version || '24' }}

      - name: Install semantic-release
        if: (inputs.release_tool || env.RELEASE_TOOL) == 'semantic-release'
        run: npm install --no-save semantic-release @semantic-release/changelog @semantic-release/git

      - name: Run semantic-release
        if: (inputs.release_tool || env.RELEASE_TOOL) == 'semantic-release'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
