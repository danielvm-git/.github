name: Test Build Release
# version: 4.2.0 — see workflow-templates/CHANGELOG.md
# Reusable workflow: call with `uses: danielvm-git/.github/.github/workflows/test-build-release-monorepo.yml@v2`
# Or copy to .github/workflows/test-build-release.yml and pair with deploy-monorepo.yml → deploy.yml

on:
  workflow_call:
    inputs:
      site_url:
        description: "Site URL for deploy metadata (optional, defaults to placeholder)"
        required: false
        type: string
        default: "https://CHANGE-ME.bigbase.click"
      release_tool:
        description: "Release tool to run: semantic-release | big-release"
        required: false
        type: string
        default: "semantic-release"
      node_subdir:
        description: "Subdirectory containing package.json (e.g. 'web'). Leave empty for root."
        required: false
        type: string
        default: ""
      pre_test:
        description: "Shell command(s) to run before tests (governance, validation)"
        required: false
        type: string
        default: ""
      post_test:
        description: "Shell command(s) to run after tests (coverage checks, extra gates)"
        required: false
        type: string
        default: ""
      pre_build:
        description: "Shell command(s) to run before build (e.g. generate assets)"
        required: false
        type: string
        default: ""
      post_build:
        description: "Shell command(s) to run after build (e.g. commit web/dist/)"
        required: false
        type: string
        default: ""
permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_TYPE: static
  SITE_URL: ${{ inputs.site_url || 'https://CHANGE-ME.bigbase.click' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Preflight
        run: |
          if [ -f scripts/preflight.sh ]; then
            bash scripts/preflight.sh
          else
            echo "WARN: No preflight script found"
          fi

      - name: Pre-test hook
        if: inputs.pre_test != ''
        run: |
          echo "Running pre-test: ${{ inputs.pre_test }}"
          ${{ inputs.pre_test }}

      - name: Check Conventional Commits
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          git log origin/main..HEAD --oneline | while read -r line; do
            # Skip merge commits (GitHub auto-merge for PRs)
            if echo "$line" | grep -qE "^[0-9a-f]+ Merge "; then
              continue
            fi
            if ! echo "$line" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: "; then
              echo "FAIL: Non-conventional commit: $line"
              exit 1
            fi
          done
          echo "PASS: All commits follow Conventional Commits"

      - name: Check no AI agent attribution
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          if git log origin/main..HEAD --format="%B" | grep -qiE '^co[- ]authored[- ]by:'; then
            echo "FAIL: Co-authored-by: footer found"
            exit 1
          fi
          echo "PASS: No AI agent attribution"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        if: hashFiles(format('{0}/package.json', inputs.node_subdir || '.')) != ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ format('{0}/package-lock.json', inputs.node_subdir || '.') }}

      - name: npm ci
        if: hashFiles(format('{0}/package.json', inputs.node_subdir || '.')) != ''
        run: npm ci${{ inputs.node_subdir && format(' --prefix {0}', inputs.node_subdir) || '' }}

      - name: npm lint
        if: hashFiles(format('{0}/package.json', inputs.node_subdir || '.')) != ''
        run: npm run lint --if-present${{ inputs.node_subdir && format(' --prefix {0}', inputs.node_subdir) || '' }}

      - name: npm typecheck
        if: hashFiles(format('{0}/package.json', inputs.node_subdir || '.')) != ''
        run: npm run typecheck --if-present${{ inputs.node_subdir && format(' --prefix {0}', inputs.node_subdir) || '' }}

      - name: npm test
        if: hashFiles(format('{0}/package.json', inputs.node_subdir || '.')) != ''
        run: npm test --if-present${{ inputs.node_subdir && format(' --prefix {0}', inputs.node_subdir) || '' }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        with:
          python-version: '3.12'

      - name: ruff and pytest
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          pip install ruff pytest
          ruff check .
          if find . -name 'test_*.py' -o -name '*_test.py' | head -1 | grep -q .; then
            pytest
          else
            echo "No pytest files found, skipping"
          fi

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        if: hashFiles('Cargo.toml') != ''
        with:
          components: clippy

      - name: cargo clippy and test
        if: hashFiles('Cargo.toml') != ''
        run: |
          cargo clippy -- -D warnings
          cargo test

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        if: hashFiles('go.mod') != ''
        with:
          go-version: '1.22'

      - name: go vet and test
        if: hashFiles('go.mod') != ''
        run: |
          go vet ./...
          go test ./...

      - name: Shell checks
        if: hashFiles('**/*.sh') != ''
        run: shellcheck **/*.sh

      - name: Post-test hook
        if: inputs.post_test != ''
        run: |
          echo "Running post-test: ${{ inputs.post_test }}"
          ${{ inputs.post_test }}

  build:
    needs: [test]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Write deploy-meta
        run: |
          jq -n \
            --arg sha "${{ github.sha }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg app_type "${{ env.APP_TYPE }}" \
            '{sha: $sha, ref: $ref, app_type: $app_type}' > deploy-meta.json

      - name: Upload deploy-meta artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deploy-meta
          path: deploy-meta.json
          retention-days: 3

      - name: Pre-build hook
        if: inputs.pre_build != ''
        run: |
          echo "Running pre-build: ${{ inputs.pre_build }}"
          ${{ inputs.pre_build }}

      - name: Post-build hook
        if: inputs.post_build != ''
        run: |
          echo "Running post-build: ${{ inputs.post_build }}"
          ${{ inputs.post_build }}

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run big-release
        if: inputs.release_tool == 'big-release'
        run: |
          curl -sL https://github.com/danielvm-git/big-release/releases/latest/download/big-release-linux-amd64 -o big-release
          chmod +x big-release
          sudo mv big-release /usr/local/bin/
          big-release release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        if: inputs.release_tool == 'semantic-release' || inputs.release_tool == ''
        with:
          node-version: 22

      - name: Install semantic-release
        if: inputs.release_tool == 'semantic-release' || inputs.release_tool == ''
        run: npm install --no-save semantic-release @semantic-release/changelog @semantic-release/git

      - name: Run semantic-release
        if: inputs.release_tool == 'semantic-release' || inputs.release_tool == ''
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
