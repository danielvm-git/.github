name: Deploy to Cloudflare Pages
# Reusable workflow. The caller builds the site, uploads it as an artifact in
# the same run, then calls this job:
#
#   deploy:
#     needs: build
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#     uses: danielvm-git/.github/.github/workflows/deploy-cloudflare-pages.yml@<sha>
#     with:
#       project: docklocker
#       domain: docklocker.danielvm.net
#     secrets: inherit
#
# Needs, in the caller repo: secret CLOUDFLARE_API_TOKEN in the environment
# "production" with Account › Cloudflare Pages › Edit,
# Zone › Zone › Read and Zone › DNS › Edit on the domain's zone; variable
# CLOUDFLARE_ACCOUNT_ID. Creates the Pages project, the custom domain and its
# CNAME the first time, then deploys. Safe to re-run.

on:
  workflow_call:
    inputs:
      project:
        description: "Pages project name (becomes <project>.pages.dev)"
        required: true
        type: string
      domain:
        description: "Custom hostname, e.g. docklocker.danielvm.net"
        required: true
        type: string
      zone:
        description: "Cloudflare zone that holds the domain"
        required: false
        type: string
        default: danielvm.net
      artifact:
        description: "Name of the artifact that holds the built site"
        required: false
        type: string
        default: site
    secrets:
      # Optional here because it usually lives in the caller's "production"
      # environment, which this job reads directly (environment secrets are
      # not passed through workflow_call). The Check step fails if it is empty.
      CLOUDFLARE_API_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ inputs.domain }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ inputs.project }}
      DOMAIN: ${{ inputs.domain }}
      ZONE: ${{ inputs.zone }}
    steps:
      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: site

      - name: Check inputs
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::variable CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          [ -f site/index.html ] || { echo "::error::artifact has no index.html"; exit 1; }
          case "$DOMAIN" in *."$ZONE") ;; *) echo "::error::$DOMAIN is not in $ZONE"; exit 1;; esac

      - name: Project, domain and DNS (first run only)
        run: |
          set -euo pipefail
          api() { # method path [json]
            local out
            out=$(curl -sS -X "$1" "https://api.cloudflare.com/client/v4$2" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              ${3:+--data "$3"})
            if [ "$(jq -r .success <<<"$out")" != "true" ]; then
              echo "::error::$1 $2: $(jq -c .errors <<<"$out")" >&2; return 1
            fi
            printf '%s' "$out"
          }
          ACC="/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"

          if ! api GET "$ACC/$PROJECT" >/dev/null 2>&1; then
            echo "creating Pages project $PROJECT"
            api POST "$ACC" "$(jq -nc --arg n "$PROJECT" '{name:$n, production_branch:"main"}')" >/dev/null
          fi

          if ! api GET "$ACC/$PROJECT/domains" | jq -e --arg d "$DOMAIN" '.result[] | select(.name==$d)' >/dev/null; then
            echo "adding custom domain $DOMAIN"
            api POST "$ACC/$PROJECT/domains" "$(jq -nc --arg d "$DOMAIN" '{name:$d}')" >/dev/null
          fi

          ZONE_ID=$(api GET "/zones?name=$ZONE" | jq -r '.result[0].id')
          [ -n "$ZONE_ID" ] && [ "$ZONE_ID" != null ] || { echo "::error::zone $ZONE not found"; exit 1; }
          # Cloudflare picks the pages.dev name; it differs from the project
          # name when that one is taken, so read it instead of guessing.
          TARGET=$(api GET "$ACC/$PROJECT" | jq -r .result.subdomain)
          [ -n "$TARGET" ] && [ "$TARGET" != null ] || { echo "::error::no pages.dev subdomain for $PROJECT"; exit 1; }
          REC=$(api GET "/zones/$ZONE_ID/dns_records?name=$DOMAIN" | jq -c '.result[0] // empty')
          if [ -z "$REC" ]; then
            echo "creating CNAME $DOMAIN -> $TARGET"
            api POST "/zones/$ZONE_ID/dns_records" \
              "$(jq -nc --arg n "$DOMAIN" --arg c "$TARGET" '{type:"CNAME", name:$n, content:$c, proxied:true, comment:"Cloudflare Pages"}')" >/dev/null
          elif [ "$(jq -r .type <<<"$REC")" != CNAME ] || [ "$(jq -r .content <<<"$REC")" != "$TARGET" ]; then
            echo "::error::$DOMAIN already has a $(jq -r .type <<<"$REC") record to $(jq -r .content <<<"$REC"); not touching it"
            exit 1
          fi

      - name: Deploy
        run: npx --yes wrangler@4.93.0 pages deploy site --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA"

      - name: Smoke test
        run: |
          # A new custom domain needs a few minutes for its certificate.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/" || echo 000)
            [ "$code" = 200 ] && { echo "https://$DOMAIN/ -> 200"; exit 0; }
            echo "attempt $i: HTTP $code"; sleep 20
          done
          echo "::error::https://$DOMAIN/ did not return 200"; exit 1
