name: Template Drift Audit
# Scheduled + manual audit of all danielvm-git portfolio repos for template version drift.
# Opens an issue when drift is detected; closes it when resolved.

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Run template version audit
        id: audit
        run: |
          bash scripts/audit-template-versions.sh > audit-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat audit-output.txt

      - name: Create or update drift issue
        if: steps.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTPUT=$(cat audit-output.txt)

          # Build issue body using printf to avoid YAML block scalar conflicts
          HEADER="## Template Drift Detected"
          INTRO="The weekly template version audit found one or more portfolio repos with out-of-date workflow templates."
          CODEBLOCK='```
          '"$OUTPUT"'
          ```'
          ACTION_REQ="For each repo listed above, update its .github/workflows/ files from workflow-templates/"
          CMD='```bash
          bash scripts/align-existing-repo.sh <repo>
          ```'
          FOOTER="---"
          SIG="_Generated by the scheduled Template Drift Audit workflow._"

          BODY="$HEADER"$'\n\n'"$INTRO"$'\n\n'"$CODEBLOCK"$'\n\n'"$ACTION_REQ"$'\n\n'"$CMD"$'\n\n'"$FOOTER"$'\n'"$SIG"

          EXISTING=$(gh issue list --label template-drift --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            gh issue update "$EXISTING" --body "$BODY"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --title "Template drift detected in portfolio repos" \
              --body "$BODY" \
              --label template-drift
          fi

      - name: Close stale drift issue
        if: steps.audit.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --label template-drift --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Template drift resolved - all portfolio repos at current version."
            echo "Closed stale drift issue #$EXISTING"
          fi
