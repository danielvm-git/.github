name: Deploy (Fullstack)
# version: 4.1.0 — see workflow-templates/CHANGELOG.md
# Reusable workflow: call with `uses: danielvm-git/.github/.github/workflows/deploy-fullstack.yml@main`
# Or copy to .github/workflows/deploy.yml and pair with test-build-release-fullstack.yml → test-build-release.yml

on:
  workflow_call:
    inputs:
      site_id:
        description: "BigBase Site ID (defaults to secrets.BIGBASE_SITE_ID)"
        required: false
        type: string
      site_url:
        description: "Full site URL to health-check post-deploy"
        required: false
        type: string
        default: "https://CHANGE-ME.bigbase.click"
      health_check_expected_body:
        description: "Expected text in response body during health check"
        required: false
        type: string
        default: ""
      ci_run_id:
        description: "Workflow run ID from the CI workflow (for artifact download)"
        required: false
        type: number
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download deploy-meta artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: deploy-meta
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Extract metadata
        id: meta
        run: |
          SHA=$(jq -r '.sha' deploy-meta.json)
          REF=$(jq -r '.ref' deploy-meta.json)
          APP_TYPE=$(jq -r '.app_type // "node"' deploy-meta.json)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "app_type=$APP_TYPE" >> "$GITHUB_OUTPUT"

      - name: Deploy to BigBase
        uses: danielvm-git/.github/actions/bigbase-deploy@main
        with:
          site_id: ${{ inputs.site_id || secrets.BIGBASE_SITE_ID }}
          app_type: ${{ steps.meta.outputs.app_type }}
          site_url: ${{ inputs.site_url || 'https://CHANGE-ME.bigbase.click' }}
          health_check_expected_body: ${{ inputs.health_check_expected_body || '' }}
          deploy_token: ${{ secrets.BIGBASE_DEPLOY_TOKEN }}
          ref: ${{ steps.meta.outputs.sha }}
