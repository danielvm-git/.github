name: 'bigbase-deploy'
description: >
  Deploy a built site/app to bigbase.click. Consolidates the pattern found
  live in astrobiologia, big-bolao, big-library, and big-olive-books into
  one hardened step: scoped token auth (never email/password), token
  masking, structured identity error mapping, and a single retry-based
  health check.

inputs:
  site_id:
    description: 'BigBase site ID (secrets.BIGBASE_SITE_ID recommended, not hardcoded)'
    required: true
  app_type:
    description: >
      Deploy profile: static | node | go | python | php |
      astro-static | astro-ssr | astro-server | astro-hybrid |
      sveltekit-static | sveltekit-node | sveltekit-ssr.
      Framework aliases map to static or node on the host.
    required: true
  site_url:
    description: 'Full URL to health-check after deploy (e.g. https://myapp.bigbase.click)'
    required: true
  deploy_token:
    description: 'Scoped BigBase deploy token (secrets.BIGBASE_DEPLOY_TOKEN). Provision via provision_ci_credentials — do NOT use account email/password.'
    required: true
  bigbase_server:
    description: 'BigBase server base URL'
    required: false
    default: 'https://bigbase.click'
  branch:
    description: 'Branch to deploy (fallback when ref is empty)'
    required: false
    default: 'main'
  ref:
    description: 'Commit SHA or tag to deploy (preferred over branch HEAD)'
    required: false
    default: ''
  passthrough_paths:
    description: 'JSON array of URL paths to pass through to the origin server (e.g. ["/api/version","/mcp"])'
    required: false
    default: '[]'
  health_check_expected_body:
    description: 'Expected text in response body during health check (optional)'
    required: false
    default: ''
  health_check_attempts:
    required: false
    default: '8'
  health_check_interval_seconds:
    required: false
    default: '10'
  skip_health_check:
    description: 'When true, omit the built-in health check (use a workflow-level Health check step instead)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Validate token and app_type
      shell: bash
      env:
        DEPLOY_TOKEN: ${{ inputs.deploy_token }}
        APP_TYPE: ${{ inputs.app_type }}
      run: |
        if [ -z "$DEPLOY_TOKEN" ]; then
          echo "::error::deploy_token not set. Provision a scoped token via provision_ci_credentials — do not use account email/password."
          exit 1
        fi
        case "$DEPLOY_TOKEN" in
          bb_dep_*) ;;
          *)
            echo "::error::deploy_token must be a bb_dep_ site key (got unexpected prefix). Use provision_ci_credentials."
            exit 1
            ;;
        esac
        case "$APP_TYPE" in
          static|node|go|python|php|\
          astro-static|astro-ssr|astro-server|astro-hybrid|\
          sveltekit-static|sveltekit-node|sveltekit-ssr)
            echo "Preflight OK: app_type=$APP_TYPE"
            ;;
          *)
            echo "::error::Unsupported app_type='$APP_TYPE'. Use static|node|go|python|php or Astro/SvelteKit aliases."
            exit 1
            ;;
        esac

    - name: Mask token
      shell: bash
      run: echo "::add-mask::${{ inputs.deploy_token }}"

    - name: Trigger BigBase deploy
      shell: bash
      env:
        DEPLOY_TOKEN: ${{ inputs.deploy_token }}
        BIGBASE_SERVER: ${{ inputs.bigbase_server }}
        SITE_ID: ${{ inputs.site_id }}
        BRANCH: ${{ inputs.branch }}
        REF_INPUT: ${{ inputs.ref }}
        APP_TYPE: ${{ inputs.app_type }}
        PASSTHROUGH_PATHS: ${{ inputs.passthrough_paths }}
      run: |
        REF="$REF_INPUT"
        if [ -z "$REF" ]; then
          REF="$BRANCH"
        fi
        case "$APP_TYPE" in
          astro-static|sveltekit-static) APP_TYPE=static ;;
          astro-ssr|astro-server|astro-hybrid|sveltekit-node|sveltekit-ssr) APP_TYPE=node ;;
        esac
        PAYLOAD=$(jq -n \
          --arg branch "$BRANCH" \
          --arg ref "$REF" \
          --arg app_type "$APP_TYPE" \
          --argjson passthrough "$PASSTHROUGH_PATHS" \
          '{branch: $branch, ref: $ref, app_type: $app_type, passthrough_paths: $passthrough}')
        RESPONSE_FILE=$(mktemp)
        trap 'rm -f "$RESPONSE_FILE"' EXIT
        set +e
        HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
          -X POST "${BIGBASE_SERVER}/api/sites/${SITE_ID}/deploy" \
          -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD")
        CURL_EXIT=$?
        set -e
        if [ "$CURL_EXIT" -ne 0 ]; then
          echo "::error::Deploy request failed (curl exit ${CURL_EXIT})"
          exit 1
        fi
        if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
          echo "Deploy accepted (HTTP ${HTTP_CODE})"
          if [ -s "$RESPONSE_FILE" ]; then
            if jq empty "$RESPONSE_FILE" 2>/dev/null; then
              jq . "$RESPONSE_FILE"
            else
              cat "$RESPONSE_FILE"
            fi
          fi
          exit 0
        fi
        BODY=""
        if [ -s "$RESPONSE_FILE" ]; then
          BODY=$(cat "$RESPONSE_FILE")
          BODY="${BODY//$DEPLOY_TOKEN/***REDACTED***}"
        fi
        CODE=""
        HINT=""
        ERRMSG=""
        if printf '%s' "$BODY" | jq empty 2>/dev/null; then
          CODE=$(printf '%s' "$BODY" | jq -r '.code // empty')
          HINT=$(printf '%s' "$BODY" | jq -r '.hint // empty')
          ERRMSG=$(printf '%s' "$BODY" | jq -r '.error // empty')
          printf '%s\n' "$BODY" | jq .
        elif [ -n "$BODY" ]; then
          printf '%s\n' "$BODY"
        else
          echo "(empty response body)"
        fi
        case "$CODE" in
          site_not_found)
            echo "::error::site_not_found — BIGBASE_SITE_ID does not match an existing site. ${HINT}"
            ;;
          key_site_mismatch)
            echo "::error::key_site_mismatch — BIGBASE_DEPLOY_TOKEN is bound to a different site than BIGBASE_SITE_ID. Rotate both secrets together via provision_ci_credentials. ${HINT}"
            ;;
          framework_mode_ambiguous|app_type_mismatch|tool_missing|site_name_taken)
            echo "::error::${CODE} — ${ERRMSG}. ${HINT}"
            ;;
          *)
            echo "::error::Deploy API returned HTTP ${HTTP_CODE}${CODE:+ ($CODE)}${ERRMSG:+: $ERRMSG}"
            ;;
        esac
        exit 1

    - name: Health check
      if: inputs.skip_health_check != 'true'
      shell: bash
      run: |
        ATTEMPTS=${{ inputs.health_check_attempts }}
        INTERVAL=${{ inputs.health_check_interval_seconds }}
        EXPECTED_BODY="${{ inputs.health_check_expected_body }}"
        for i in $(seq 1 "$ATTEMPTS"); do
          RESPONSE_FILE=$(mktemp)
          STATUS=$(curl -s -o "$RESPONSE_FILE" -w '%{http_code}' "${{ inputs.site_url }}" || echo "000")
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            if [ -n "$EXPECTED_BODY" ]; then
              if grep -q "$EXPECTED_BODY" "$RESPONSE_FILE"; then
                echo "✅ Site LIVE and body matches '$EXPECTED_BODY' (HTTP $STATUS)"
                rm -f "$RESPONSE_FILE"
                exit 0
              else
                echo "Attempt $i/$ATTEMPTS: HTTP $STATUS OK but body missing '$EXPECTED_BODY', waiting ${INTERVAL}s..."
              fi
            else
              echo "✅ Site LIVE (HTTP $STATUS)"
              rm -f "$RESPONSE_FILE"
              exit 0
            fi
          else
            echo "Attempt $i/$ATTEMPTS: HTTP $STATUS, waiting ${INTERVAL}s..."
          fi
          rm -f "$RESPONSE_FILE"
          sleep "$INTERVAL"
        done
        echo "::error::Health check failed after $ATTEMPTS attempts"
        exit 1
